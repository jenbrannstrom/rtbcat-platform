services:
  api:
    environment:
      OAUTH2_PROXY_ENABLED: "true"
      OAUTH2_PROXY_TRUSTED_IPS: "${RTBCAT_OAUTH2_PROXY_TRUSTED_IPS:?Set RTBCAT_OAUTH2_PROXY_TRUSTED_IPS}"
      CATSCAN_ENABLE_GOOGLE_LOGIN: "true"
      CATSCAN_ENABLE_PASSWORD_LOGIN: "false"
      CATSCAN_DEFAULT_LOGIN_METHOD: "google"
      CATSCAN_READ_ONLY_SHADOW: "true"
      CATSCAN_ENABLE_GMAIL_IMPORT_SCHEDULER: "false"
      CATSCAN_ENABLE_PRECOMPUTE_SCHEDULER: "false"
      CATSCAN_ENABLE_CREATIVE_CACHE_SCHEDULER: "false"
